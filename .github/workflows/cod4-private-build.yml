name: COD4iOS Private Bootstrap Build
on:
  push:
    branches: [cod4-private-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Clone COD4iOS source
        run: |
          git clone --depth 1 https://github.com/DevZer0D4Y/COD4iOS-COD4NS.git cod4src

      - name: Add bundled-data bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("cod4src/ports/ios/app/engine_app.mm")
          s = p.read_text()
          needle = '''- (BOOL)hasGameData:(NSString *)root
          {
              NSFileManager *files = NSFileManager.defaultManager;
              BOOL isDirectory = NO;
              return [files fileExistsAtPath:[root stringByAppendingPathComponent:@"localization.txt"]]
                  && [files fileExistsAtPath:[root stringByAppendingPathComponent:@"main"] isDirectory:&isDirectory] && isDirectory
                  && [files fileExistsAtPath:[root stringByAppendingPathComponent:@"zone"] isDirectory:&isDirectory] && isDirectory;
          }
          '''
          insert = r'''- (BOOL)hasGameData:(NSString *)root
          {
              NSFileManager *files = NSFileManager.defaultManager;
              BOOL isDirectory = NO;
              return [files fileExistsAtPath:[root stringByAppendingPathComponent:@"localization.txt"]]
                  && [files fileExistsAtPath:[root stringByAppendingPathComponent:@"main"] isDirectory:&isDirectory] && isDirectory
                  && [files fileExistsAtPath:[root stringByAppendingPathComponent:@"zone"] isDirectory:&isDirectory] && isDirectory;
          }

          - (void)mirrorBundledGameDataIntoDocuments:(NSString *)documents
          {
              NSFileManager *fm = NSFileManager.defaultManager;
              NSString *source = [[NSBundle mainBundle].bundlePath stringByAppendingPathComponent:@"GameData"];
              BOOL isDir = NO;
              if (![fm fileExistsAtPath:source isDirectory:&isDir] || !isDir)
                  return;

              NSArray<NSString *> *roots = @[@"main", @"zone"];
              for (NSString *rootName in roots)
              {
                  NSString *srcRoot = [source stringByAppendingPathComponent:rootName];
                  NSString *dstRoot = [documents stringByAppendingPathComponent:rootName];
                  if (![fm fileExistsAtPath:srcRoot isDirectory:&isDir] || !isDir)
                      continue;
                  [fm createDirectoryAtPath:dstRoot withIntermediateDirectories:YES attributes:nil error:nil];

                  NSDirectoryEnumerator *en = [fm enumeratorAtURL:[NSURL fileURLWithPath:srcRoot]
                                      includingPropertiesForKeys:@[NSURLIsDirectoryKey]
                                                         options:0
                                                    errorHandler:nil];
                  for (NSURL *url in en)
                  {
                      NSString *rel = [url.path substringFromIndex:srcRoot.length + 1];
                      NSString *dst = [dstRoot stringByAppendingPathComponent:rel];
                      NSNumber *dirFlag = nil;
                      [url getResourceValue:&dirFlag forKey:NSURLIsDirectoryKey error:nil];
                      if (dirFlag.boolValue)
                      {
                          [fm createDirectoryAtPath:dst withIntermediateDirectories:YES attributes:nil error:nil];
                      }
                      else if (![fm fileExistsAtPath:dst])
                      {
                          [fm createDirectoryAtPath:[dst stringByDeletingLastPathComponent]
                        withIntermediateDirectories:YES attributes:nil error:nil];
                          NSError *err = nil;
                          if (![fm createSymbolicLinkAtPath:dst withDestinationPath:url.path error:&err])
                              NSLog(@"COD4iOS bootstrap: symlink failed %@ -> %@: %@", dst, url.path, err);
                      }
                  }
              }

              NSString *srcLoc = [source stringByAppendingPathComponent:@"localization.txt"];
              NSString *dstLoc = [documents stringByAppendingPathComponent:@"localization.txt"];
              if ([fm fileExistsAtPath:srcLoc] && ![fm fileExistsAtPath:dstLoc])
              {
                  NSError *err = nil;
                  if (![fm createSymbolicLinkAtPath:dstLoc withDestinationPath:srcLoc error:&err])
                      NSLog(@"COD4iOS bootstrap: localization symlink failed: %@", err);
              }
          }
          '''
          if needle not in s:
              raise SystemExit("expected hasGameData block not found")
          s = s.replace(needle, insert, 1)
          old = '''    NSString *root = [self documentsPath];
              if (![self hasGameData:root])
          '''
          new = '''    NSString *root = [self documentsPath];
              [self mirrorBundledGameDataIntoDocuments:root];
              if (![self hasGameData:root])
          '''
          if old not in s:
              raise SystemExit("expected startIfReady block not found")
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Configure project
        run: |
          cd cod4src
          brew install cmake python
          bash tools/configure-ios.sh

      - name: Build unsigned ARM64 app
        run: |
          cd cod4src
          xcodebuild -project build/ios/xcode-engine/KisakCOD.xcodeproj \
            -target KisakCOD-Combined -configuration Release -sdk iphoneos \
            -jobs 1 CODE_SIGNING_ALLOWED=NO build

      - name: Package bootstrap IPA
        run: |
          cd cod4src
          APP="build/ios/xcode-engine/ports/ios/Release-iphoneos/KisakCOD.app"
          test -d "$APP"
          rm -rf Payload artifact
          mkdir -p Payload artifact
          cp -R "$APP" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload artifact/COD4iOS-bootstrap-unsigned.ipa
          shasum -a 256 artifact/COD4iOS-bootstrap-unsigned.ipa > artifact/SHA256.txt
          unzip -l artifact/COD4iOS-bootstrap-unsigned.ipa > artifact/IPA-CONTENTS.txt

      - name: Upload bootstrap IPA
        uses: actions/upload-artifact@v4
        with:
          name: COD4iOS-bootstrap-IPA
          path: cod4src/artifact
